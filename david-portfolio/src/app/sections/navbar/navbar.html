<header class="fixed left-0 top-0 z-50 w-full px-6 py-4">
  <nav
    class="mx-auto flex max-w-6xl items-center justify-between rounded-2xl border border-white/10 bg-slate-950/70 px-5 py-3 shadow-2xl shadow-black/20 backdrop-blur-xl"
  >
    <a href="#hero" class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-violet-600 to-cyan-500 font-bold text-white shadow-lg shadow-cyan-500/20"
      >
        D
      </span>

      <span class="text-base font-bold tracking-wide text-white">
        David<span class="text-cyan-400">.</span>
      </span>
    </a>

    <div
      class="hidden items-center rounded-xl border border-white/10 bg-white/5 p-1 md:flex"
    >
      @for (item of navigation; track item.url) {
        <a
          [href]="item.url"
          class="rounded-lg px-4 py-2 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          {{ item.label }}
        </a>
      }
    </div>

    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="toggleTheme()"
        class="hidden h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-lg text-white transition hover:bg-white/10 md:inline-flex"
        aria-label="Cambiar tema"
      >
        @if (themeService.theme() === 'dark') {
          ☀️
        } @else {
          🌙
        }
      </button>

      <a
        href="#contact"
        class="hidden rounded-xl bg-gradient-to-r from-violet-600 to-cyan-500 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-cyan-500/20 transition hover:scale-105 md:inline-flex"
      >
        Hablemos
      </a>
    </div>
  </nav>
</header>
